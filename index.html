<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Studio - Ultimate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME & GLOBAL --- */
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #2d3436;
            --glass: rgba(255, 255, 255, 0.90);
        }

        * { box-sizing: border-box; tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #240b36, #c31432, #240b36); 
            background-size: 400% 400%;
            animation: cosmicFlow 10s ease infinite;
            color: var(--dark);
            height: 100vh;
            display: flex; justify-content: center; overflow: hidden;
        }

        @keyframes cosmicFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #app-container {
            width: 100%; max-width: 450px; height: 100%;
            background: var(--glass);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative; display: flex; flex-direction: column;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            overflow-y: auto; scroll-behavior: smooth;
        }

        /* --- SCREENS --- */
        .screen {
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%; padding: 30px; text-align: center;
            opacity: 0; transform: scale(0.95);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .active-screen { display: flex; opacity: 1; transform: scale(1); }

        h1 { font-size: 40px; color: var(--primary); margin-bottom: 5px; }
        h2 { font-size: 24px; color: #444; margin-bottom: 25px; font-weight: 600; }
        p { color: #666; font-size: 14px; }

        /* --- INPUTS & BUTTONS --- */
        input {
            width: 100%; padding: 18px; margin-bottom: 20px;
            border: 2px solid transparent; border-radius: 20px;
            font-size: 16px; outline: none; text-align: center;
            background: #f1f2f6; transition: 0.3s;
        }
        input:focus { background: white; border-color: var(--primary); box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2); }
        .input-error { animation: shake 0.4s; border-color: #e74c3c !important; background: #ffeaea !important; }
        @keyframes shake { 0%,100% {transform: translateX(0);} 25%,75% {transform: translateX(-10px);} 50% {transform: translateX(10px);} }

        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white; border: none; padding: 16px 50px;
            border-radius: 50px; font-size: 18px; font-weight: bold;
            cursor: pointer; width: 100%;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.4);
            transition: transform 0.2s;
        }
        .btn-primary:active { transform: scale(0.95); }

        /* --- HEADER & SEARCH --- */
        #screen-home { justify-content: flex-start; padding: 0; padding-bottom: 90px; }
        
        .home-header {
            width: 100%; padding: 25px;
            background: white; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        .search-wrapper { position: relative; height: 40px; display: flex; align-items: center; justify-content: flex-end; }
        .search-input {
            width: 0; padding: 0; border: none; outline: none; background: transparent;
            font-size: 16px; color: var(--primary); transition: 0.5s;
            position: absolute; right: 40px; opacity: 0;
        }
        .search-btn {
            width: 40px; height: 40px; border-radius: 50%; background: #f1f2f6;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 18px; cursor: pointer; transition: 0.3s;
            z-index: 2;
        }
        .search-wrapper.active .search-input { width: 200px; opacity: 1; padding-right: 10px; }
        .search-wrapper.active .search-btn { background: var(--primary); color: white; transform: rotate(90deg); }

        /* --- CATEGORIES --- */
        .cat-trigger {
            background: var(--dark); color: white; padding: 18px; margin: 20px;
            border-radius: 20px; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center; font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.3s;
        }
        #category-list { display: none; padding: 0 20px; }
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 20px; }
        
        .cat-card { 
            background: white; padding: 20px; border-radius: 25px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); cursor: pointer; 
            opacity: 0; transform: translateY(30px); transition: 0.3s; text-align: center;
        }
        .cat-card:hover { transform: translateY(-5px); border: 1px solid var(--secondary); }
        .cat-card.show { animation: popIn 0.5s forwards; }
        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }
        
        .cat-icon { font-size: 28px; margin-bottom: 10px; color: var(--primary); }
        .owl-special { grid-column: span 2; background: linear-gradient(135deg, #2c3e50, #000); color: gold; border: 1px solid gold; }
        .owl-special .cat-icon { color: gold; }

        /* --- PRODUCTS & CART --- */
        .product-list { padding: 20px; width: 100%; }
        .product-card { 
            background: white; border-radius: 25px; padding: 15px; margin-bottom: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .p-price { color: var(--primary); font-weight: 800; font-size: 18px; margin: 5px 0; }
        .img-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .img-scroll::-webkit-scrollbar { display: none; }
        .p-img { width: 140px; height: 160px; object-fit: cover; border-radius: 15px; border: 1px solid #f1f2f6; flex-shrink: 0; }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 15px; margin: 15px 20px; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-left: 5px solid var(--primary);
            animation: slideInRight 0.3s ease-out;
        }
        @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- BOTTOM NAV --- */
        .bottom-nav { 
            position: absolute; bottom: 20px; left: 5%; width: 90%; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            padding: 15px 0; display: flex; justify-content: space-around; 
            border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); z-index: 999;
        }
        .nav-item { color: #b2bec3; font-size: 20px; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 5px; height: 5px; background: var(--primary); border-radius: 50%;
        }

        /* --- UTILS --- */
        #toast { 
            visibility: hidden; min-width: 250px; background: rgba(45, 52, 54, 0.95); 
            color: #fff; text-align: center; border-radius: 50px; padding: 16px; 
            position: fixed; z-index: 1001; bottom: 100px; left: 50%; transform: translateX(-50%); 
            opacity: 0; transition: 0.4s; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 110px; }
        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(5px); z-index: 1002; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e1e1e1; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="app-container">

        <div id="screen-splash" class="screen active-screen">
            <h1 style="font-size: 50px;">AR</h1>
            <p style="letter-spacing: 2px; text-transform: uppercase; font-weight: bold;">Studio Premium</p>
            <br><br>
            <button class="btn-primary" onclick="navTo('name')">ENTER EXPERIENCE</button>
        </div>

        <div id="screen-name" class="screen">
            <h2>Who is joining us?</h2>
            <input type="text" id="inp-name" placeholder="Your Name">
            <button class="btn-primary" onclick="validateName()">Continue</button>
        </div>

        <div id="screen-phone" class="screen">
            <h2>Your Contact</h2>
            <input type="number" id="inp-phone" placeholder="Phone Number">
            <button class="btn-primary" onclick="validatePhone()">Next Step</button>
        </div>

        <div id="screen-email" class="screen">
            <h2>Email Address</h2>
            <input type="email" id="inp-email" placeholder="email@domain.com">
            <button class="btn-primary" onclick="validateEmail()">Finish Setup</button>
        </div>

        <div id="screen-welcome" class="screen">
            <div style="font-size: 60px;">🎉</div>
            <h1 id="greet-name">Welcome</h1>
            <p>Your premium account is ready.</p>
            <br>
            <button class="btn-primary" onclick="fakeLoad('home')">Launch App</button>
        </div>

        <div id="screen-home" class="screen">
            <div class="home-header">
                <div>
                    <h2 style="margin:0; font-size: 20px; color: var(--dark);">Collections</h2>
                    <p style="margin:0; font-size:12px; opacity: 0.6;">AR Studio Exclusives</p>
                </div>
                <div class="search-wrapper" id="search-box">
                    <input type="text" class="search-input" placeholder="Search...">
                    <div class="search-btn" onclick="toggleSearch()">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
            </div>

            <div class="cat-trigger" onclick="toggleCategories()">
                <span>Browse Categories</span>
                <i class="fas fa-chevron-down" id="cat-arrow"></i>
            </div>

            <div id="category-list">
                <div class="cat-grid">
                    <div class="cat-card" onclick="showProducts('mobile')" style="animation-delay: 0.05s;"><i class="fas fa-mobile-alt cat-icon"></i><div>Mobile</div></div>
                    <div class="cat-card" onclick="showProducts('tv')" style="animation-delay: 0.1s;"><i class="fas fa-tv cat-icon"></i><div>TV</div></div>
                    <div class="cat-card owl-special" onclick="showProducts('owl')" style="animation-delay: 0.15s;"><i class="fas fa-crow cat-icon"></i><div>The Owl</div></div>
                </div>
            </div>
        </div>

        <div id="screen-products" class="screen" style="justify-content: flex-start; padding: 0;">
            <div style="padding: 25px; display: flex; align-items: center; width:100%;">
                <i class="fas fa-arrow-left" onclick="navTo('home')" style="cursor: pointer; font-size: 22px; color: var(--primary);"></i>
                <span id="p-page-title" style="margin-left: 20px; font-weight: 700; font-size: 20px; color: var(--dark);">Products</span>
            </div>
            <div id="product-container" class="product-list"></div>
        </div>

        <div id="screen-cart" class="screen" style="justify-content: flex-start; padding: 0;">
            <h2 style="margin-top: 30px; color: var(--primary);">My Cart</h2>
            <div id="cart-content" style="width: 100%;"></div>
        </div>

        <div id="screen-notebook" class="screen" style="justify-content: flex-start;">
            <h2 style="margin-top: 30px; color: var(--primary);">Notebook</h2>
            <textarea id="user-note" style="width:100%; height:50vh; border:none; padding:20px; border-radius:20px; background:#f8f9fa; outline:none; font-size: 16px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);" placeholder="Write your wishlist..."></textarea>
            <button class="btn-primary" onclick="showToast('Note Saved!')" style="margin-top:20px;">Save Note</button>
        </div>

        <div id="bottom-bar" class="bottom-nav" style="display: none;">
            <div class="nav-item active" onclick="navTo('home')"><i class="fas fa-home"></i></div>
            <div class="nav-item" onclick="toggleSearch(); navTo('home');"><i class="fas fa-search"></i></div>
            <div class="nav-item" onclick="openCart()"><i class="fas fa-shopping-bag"></i></div>
            <div class="nav-item" onclick="navTo('notebook')"><i class="fas fa-book"></i></div>
        </div>

    </div>

    <div id="toast">Notification</div>
    <div id="loader"><div class="spinner"></div></div>

    <script>
        // --- DATA ---
        const db = {
            mobile: [
                { name: "Vivo T4x", price: "₹14,999", imgs: ["https://i.ibb.co/7xDjMDbk/img1.jpg", "https://i.ibb.co/vCXFgjYr/img2.jpg"] },
                { name: "iPhone 17 Pro", price: "₹1,59,999", imgs: ["https://i.ibb.co/Kz5hhG7T/img3.jpg", "https://i.ibb.co/DfTwpQnK/img4.jpg"] },
                { name: "Samsung S25", price: "₹1,24,999", imgs: ["https://i.ibb.co/1YSz7yBL/img7.jpg", "https://i.ibb.co/WWLp74x2/img8.jpg"] }
            ],
            owl: [ { name: "Asif Pacha", price: "$12,000", imgs: ["https://i.ibb.co/1YJjkJds/owl.jpg"] } ],
            tv: []
        };

        let cart = [];
        let userName = "";

        // --- NAVIGATION ---
        function navTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.screen').forEach(s => setTimeout(() => s.style.display = 'none', 300));

            const nav = document.getElementById('bottom-bar');
            if(['home', 'products', 'cart', 'notebook'].includes(id)) {
                nav.style.display = 'flex';
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                if(id === 'home') document.querySelectorAll('.nav-item')[0].classList.add('active');
                if(id === 'cart') document.querySelectorAll('.nav-item')[2].classList.add('active');
                if(id === 'notebook') document.querySelectorAll('.nav-item')[3].classList.add('active');
            } else {
                nav.style.display = 'none';
            }

            setTimeout(() => {
                document.getElementById('screen-' + id).style.display = 'flex';
                setTimeout(() => { document.getElementById('screen-' + id).classList.add('active-screen'); }, 10);
            }, 300);
        }

        // --- VALIDATION ---
        function validateName() {
            const i = document.getElementById('inp-name');
            if(!i.value.trim()) { shake(i); showToast("Name is required"); }
            else { userName = i.value; document.getElementById('greet-name').innerText = "Hi " + userName; navTo('phone'); }
        }
        function validatePhone() {
            const i = document.getElementById('inp-phone');
            if(i.value.length < 10) { shake(i); showToast("Invalid Number"); } else navTo('email');
        }
        function validateEmail() {
            const i = document.getElementById('inp-email');
            if(!i.value.includes('@')) { shake(i); showToast("Invalid Email"); } else fakeLoad('welcome');
        }
        function shake(el) { el.classList.add('input-error'); setTimeout(()=>el.classList.remove('input-error'), 400); }

        // --- UI LOGIC ---
        function toggleSearch() {
            document.getElementById('search-box').classList.toggle('active');
            if(document.getElementById('search-box').classList.contains('active')) {
                document.querySelector('.search-input').focus();
            }
        }

        function toggleCategories() {
            const list = document.getElementById('category-list');
            const arrow = document.getElementById('cat-arrow');
            if(list.style.display === 'block') {
                list.style.display = 'none'; arrow.className = "fas fa-chevron-down";
            } else {
                list.style.display = 'block'; arrow.className = "fas fa-chevron-up";
                document.querySelectorAll('.cat-card').forEach(c => {
                    c.classList.remove('show');
                    void c.offsetWidth; 
                    c.classList.add('show');
                });
            }
        }

        // --- PRODUCTS ---
        function showProducts(cat) {
            const c = document.getElementById('product-container');
            c.innerHTML = "";
            document.getElementById('p-page-title').innerText = cat.toUpperCase();
            
            const items = db[cat];
            if(!items || items.length === 0) {
                c.innerHTML = "<p style='color:#999; margin-top:50px;'>No items available.</p>";
            } else {
                items.forEach(item => {
                    let imgs = "";
                    item.imgs.forEach(url => imgs += `<img src="${url}" class="p-img" onerror="this.src='https://via.placeholder.com/150'">`);
                    
                    c.innerHTML += `
                        <div class="product-card">
                            <div class="img-scroll">${imgs}</div>
                            <h3 style="margin:10px 0 5px 0; font-size:18px;">${item.name}</h3>
                            <div class="p-price">${item.price}</div>
                            <div style="display:flex; gap:10px; margin-top:15px;">
                                <button class="btn-primary" style="padding:10px; font-size:14px;" onclick="showToast('Order Placed!')">Buy Now</button>
                                <button class="btn-primary" style="padding:10px; font-size:14px; background:#f1f2f6; color:#333; box-shadow:none;" onclick="addToCart('${item.name}', '${item.price}')">Add</button>
                            </div>
                        </div>
                    `;
                });
            }
            navTo('products');
        }

        // --- CART ---
        function addToCart(name, price) {
            cart.push({name, price});
            showToast("Added to Cart");
        }

        function openCart() {
            const c = document.getElementById('cart-content');
            c.innerHTML = "";
            
            if(cart.length === 0) {
                c.innerHTML = `
                    <div style="margin-top:50px; opacity:0.5;">
                        <i class="fas fa-ghost" style="font-size:50px; margin-bottom:20px;"></i>
                        <p>Your cart is empty.</p>
                        <button onclick="navTo('home')" style="border:none; background:none; color:var(--primary); font-weight:bold; cursor:pointer; margin-top:10px;">Go Shopping</button>
                    </div>
                `;
            } else {
                cart.forEach((item, i) => {
                    c.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <div style="font-weight:bold;">${item.name}</div>
                                <div style="font-size:12px; color:#888;">${item.price}</div>
                            </div>
                            <i class="fas fa-trash" style="color:#e74c3c; cursor:pointer;" onclick="remItem(${i})"></i>
                        </div>
                    `;
                });
                c.innerHTML += `<button class="btn-primary" style="margin:30px 20px; width:auto;" onclick="showToast('Checkout Started...')">Proceed to Checkout</button>`;
            }
            navTo('cart');
        }

        function remItem(i) {
            cart.splice(i, 1);
            openCart();
            showToast("Item Removed");
        }

        // --- UTILS ---
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function fakeLoad(target) {
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; navTo(target); }, 1500);
        }

        // Init
        document.getElementById('screen-splash').style.display = 'flex';
        setTimeout(() => document.getElementById('screen-splash').classList.add('active-screen'), 10);
    </script>
</body>
</html>
